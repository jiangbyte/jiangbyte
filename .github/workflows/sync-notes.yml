name: Sync content to github.io

on:
  push:
    branches: [main]
    paths:
      - "Notes/**"
      - "Projects/**"
      - "scripts/**"
      - ".github/workflows/sync-notes.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout jiangbyte
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Ensure Hugo frontmatter on Notes
        run: python3 scripts/add_frontmatter.py

      - name: Commit frontmatter updates in Notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain Notes)" ]; then
            git add Notes
            git commit -m "chore: ensure Hugo frontmatter on Notes"
            git push
          else
            echo "No Notes frontmatter changes"
          fi

      - name: Trigger site build (Notes/Projects stay out of site repo)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/jiangbyte/jiangbyte.github.io/dispatches \
            -f event_type='content-updated'
