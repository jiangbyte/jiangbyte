name: sync notes to github.io

on:
  push:
    branches: [main]
    paths:
      - "Notes/**"
      - "TOC.md"
      - "scripts/**"
      - ".github/workflows/sync-notes.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout jiangbyte
        uses: actions/checkout@v4
        with:
          path: jiangbyte

      - name: Checkout jiangbyte.github.io
        uses: actions/checkout@v4
        with:
          repository: jiangbyte/jiangbyte.github.io
          token: ${{ secrets.GH_PAT }}
          path: jiangbyte.github.io

      - name: Ensure frontmatter then sync into content/blog
        run: |
          set -euo pipefail
          python3 jiangbyte/scripts/add_frontmatter.py
          python3 jiangbyte.github.io/scripts/sync_notes.py "$(pwd)/jiangbyte/Notes"
          # if frontmatter changed in Notes, commit back to jiangbyte
          cd jiangbyte
          if ! git diff --quiet -- Notes; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Notes
            git commit -m "chore: refresh Notes frontmatter"
            git push
          fi

      - name: Commit and push site content
        working-directory: jiangbyte.github.io
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blog public/notes
          if git diff --staged --quiet; then
            echo "No site content changes"
            exit 0
          fi
          git commit -m "chore: sync Notes from jiangbyte@${GITHUB_SHA::7}"
          git push origin HEAD:main
