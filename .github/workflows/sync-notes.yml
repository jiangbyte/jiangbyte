# Content publish no longer uses repository_dispatch.
# Use ./scripts/push.sh — it syncs Notes/Projects into jiangbyte.github.io
# on branch sync/content; that repo's workflow merges into main and deploys.
#
# This workflow only keeps Hugo frontmatter tidy when Notes are pushed
# without going through push.sh.
name: Ensure Notes frontmatter

on:
  push:
    branches: [main]
    paths:
      - "Notes/**"
      - "scripts/add_frontmatter.py"
      - ".github/workflows/sync-notes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontmatter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout jiangbyte
        uses: actions/checkout@v4

      - name: Ensure Hugo frontmatter on Notes
        run: python3 scripts/add_frontmatter.py

      - name: Commit frontmatter updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain Notes)" ]; then
            git add Notes
            git commit -m "chore: ensure Hugo frontmatter on Notes"
            git push
          else
            echo "No Notes frontmatter changes"
          fi
