name: Sync Notes to github.io

on:
  push:
    branches: [main]
    paths:
      - "Notes/**"
      - "scripts/**"
      - ".github/workflows/sync-notes.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout jiangbyte
        uses: actions/checkout@v4
        with:
          path: jiangbyte
          token: ${{ secrets.GH_PAT }}

      - name: Checkout jiangbyte.github.io
        uses: actions/checkout@v4
        with:
          repository: jiangbyte/jiangbyte.github.io
          path: github-io
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Ensure Hugo frontmatter
        run: python3 jiangbyte/scripts/add_frontmatter.py

      - name: Commit frontmatter updates in Notes
        working-directory: jiangbyte
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain Notes)" ]; then
            git add Notes
            git commit -m "chore: ensure Hugo frontmatter on Notes"
            git push
          else
            echo "No Notes frontmatter changes"
          fi

      - name: Sync Notes into site
        run: python3 github-io/scripts/sync_notes.py "$GITHUB_WORKSPACE/jiangbyte/Notes"

      - name: Commit and push site
        working-directory: github-io
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts static/notes
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: sync Notes from jiangbyte"
            git push
          else
            echo "No site changes"
          fi
